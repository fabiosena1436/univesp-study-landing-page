name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: aprova_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U app -d aprova_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/aprova_test
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/aprova_test
      APP_URL: http://localhost:3100
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:test:setup
      - run: npm run build
      - run: npm run test:e2e
